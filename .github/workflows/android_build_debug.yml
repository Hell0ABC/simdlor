name: Android Debug and Release

on:
  push:
    branches: [release/*]
  pull_request:
    branches: [release/*]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.10"

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev libssl-dev libltdl-dev cmake libcairo2 libcairo2-dev python3-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

  build:
    runs-on: ubuntu-latest

    needs: prepare

    steps:
      - name: Run pytest
        run: python -m pytest

      - name: Make build script executable
        run: chmod +x app/build

      - name: Build debug APK
        run: bash app/build --mode debug

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: |
            bin/*.apk
            app/build.log

  test:
    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-builds
          path: .

      - name: List APK files
        run: ls -la bin/
      
      - name: Install and smoke-test APK on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            set -euo pipefail
            APK_PATH=$(find bin -maxdepth 1 -name "*.apk" | head -n 1)
            if [[ -z "${APK_PATH:-}" ]]; then
              echo "No APK artifact found in bin/"
              exit 1
            fi
            echo "Installing $APK_PATH"
            adb install -r "$APK_PATH"
            echo "Verifying package installation"
            adb shell pm list packages | grep -F "app.helloabc.simdlor"
